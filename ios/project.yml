# XcodeGen spec: `brew install xcodegen && cd ios && xcodegen` creates Peaker.xcodeproj (not committed).
name: Peaker
options:
  bundleIdPrefix: com.moritzwolf
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Full data-race checking (as warnings in Swift 5 mode). Services, stores and AppModel also build
    # cleanly in Swift 6 mode; switch SWIFT_VERSION to 6.0 once an Xcode build shows no warnings.
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    # Country packs (catalog at <url>/v1/catalog.json). Public GitHub repo mowolf/height-data;
    # CI can override it with the repository variable PEAKER_DATA_URL.
    PEAKER_DATA_URL: "https://raw.githubusercontent.com/mowolf/height-data/main"

packages:
  PeakerKit:
    path: PeakerKit

targets:
  Peaker:
    type: application
    platform: iOS
    sources:
      - path: Peaker
        excludes:
          - "Resources/BundledPacks"
          - "Resources/BundledPacks/**"
      # Offline packs shipped inside the app (one folder per pack, see pipeline `bundle` command).
      - path: Peaker/Resources/BundledPacks
        type: folder
        buildPhase: resources
    dependencies:
      - package: PeakerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moritzwolf.peaker
        PRODUCT_NAME: Peaker
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    info:
      path: Peaker/Info.plist
      properties:
        CFBundleDisplayName: Peaker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.navigation
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Peaker shows the names of the mountains on top of the camera image.
        NSLocationWhenInUseUsageDescription: Peaker uses your location to work out which mountains you can see.
        NSMotionUsageDescription: Peaker uses the compass and motion sensors to know where you are pointing the iPhone.
        PeakerDataURL: $(PEAKER_DATA_URL)

schemes:
  Peaker:
    build:
      targets:
        Peaker: all
    run:
      config: Debug
    archive:
      config: Release
