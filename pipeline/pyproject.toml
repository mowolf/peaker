[project]
name = "peaker-pipeline"
version = "0.1.0"
description = "Builds Peaker's offline elevation tiles and peak databases, packaged by country"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "rasterio>=1.4",
    "shapely>=2.0",
    "pyogrio>=0.10",
    "pillow>=11",
    "osmium>=4.0",
    "requests>=2.32",
    "scipy>=1.14",
    "brotli>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
peaker-pipeline = "peaker_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["peaker_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access (deselect with -m 'not network')"]
