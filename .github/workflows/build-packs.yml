name: build-packs

# Rebuilds the peak databases of the countries in pipeline/packs.txt (OpenStreetMap + GeoNames, optionally
# Wikidata) and publishes them to the public data repo mowolf/height-data, next to the elevation tiles that
# are already published there (tiles rarely change; this job reads their index instead of rebuilding gigabytes
# of tiles). For a new country, run it by hand with its code and "build_tiles" on: its tiles are built too.
# Setup: secret HEIGHT_DATA_TOKEN = fine-grained token with "Contents: read and write" on mowolf/height-data.
# Without it the packs are built and attached to the run as an artifact.

on:
  workflow_dispatch:
    inputs:
      countries:
        description: "ISO codes, space separated (empty = pipeline/packs.txt)"
        required: false
        default: ""
      publish:
        description: "Push to mowolf/height-data"
        type: boolean
        default: true
      build_tiles:
        description: "Also build the elevation tiles from Copernicus (for countries added to packs.txt)"
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC: OSM peaks change weekly, tiles don't

concurrency:
  group: build-packs # never two builds pushing to the data repo at once
  cancel-in-progress: false

permissions:
  contents: read

env:
  PEAKER_CACHE: ${{ github.workspace }}/.peaker-cache
  OUT: ${{ github.workspace }}/out
  DATA_REPO: mowolf/height-data
  TILE_INDEX: https://raw.githubusercontent.com/mowolf/height-data/main/v1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install pipeline and run unit tests
        working-directory: pipeline
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e '.[dev]'
          .venv/bin/python -m pytest -q -m "not network"

      # Download cache: Copernicus 90 m sources (summit heights), GeoNames, extracted OSM peaks, Wikidata tiles.
      - name: Restore download cache
        uses: actions/cache/restore@v4
        with:
          path: .peaker-cache
          key: peaker-cache-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: peaker-cache-v2-

      - name: Expire stale cache entries
        run: |
          mkdir -p "$PEAKER_CACHE"
          find "$PEAKER_CACHE/wikidata" -type f -mtime +30 -delete 2>/dev/null || true
          find "$PEAKER_CACHE/geonames" -type f -mtime +7 -delete 2>/dev/null || true
          find "$PEAKER_CACHE/osm-peaks" -type f -mtime +6 -delete 2>/dev/null || true
          find "$PEAKER_CACHE/geofabrik" -type f -mtime +1 -delete 2>/dev/null || true
          rm -rf "$PEAKER_CACHE/copernicus-30m"  # not needed here; tiles are prebuilt
          du -sh "$PEAKER_CACHE"/* 2>/dev/null || true

      - name: Build peak databases
        working-directory: pipeline
        env:
          INPUT_COUNTRIES: ${{ github.event.inputs.countries }}
          BUILD_TILES: ${{ github.event.inputs.build_tiles }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_COUNTRIES" ]; then
            plan=$(for c in $INPUT_COUNTRIES; do grep -E "^${c^^}( |$)" packs.txt || echo "${c^^}"; done)
          else
            plan=$(sed 's/#.*//' packs.txt | grep -E '^[A-Z]{2}')
          fi
          # New countries: build their tiles from Copernicus (90 m everywhere, 30 m where mountainous) instead
          # of reading the published tile index.
          tiles="--tile-index $TILE_INDEX"
          if [ "${BUILD_TILES:-false}" = "true" ]; then tiles="--workers 4"; fi
          echo "$plan" | while read -r code args; do
            [ -n "$code" ] || continue
            extra="--no-wikidata"
            case " $args " in *" --wikidata "*) extra=""; args="${args//--wikidata/}";; esac
            echo "::group::$code $args $extra"
            .venv/bin/peaker-pipeline pack "$code" --res 90 30 $tiles --drop-pbf \
              --out "$OUT" $args $extra || echo "::warning::$code failed"
            echo "::endgroup::"
          done

      - name: Summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json, os
          files = sorted(glob.glob(os.path.join(os.environ["OUT"], "reports", "*.json")))
          if not files:
              print("No reports (build failed early)."); raise SystemExit
          print("| pack | tiles | peaks | OSM peaks in country | sources | build s |")
          print("|---|---|---|---|---|---|")
          for f in files:
              r = json.load(open(f))
              src = ", ".join(f"{k}: {v}" for k, v in r["peaks_by_source"].items())
              own = r.get("osm_peaks_in_country", "?")
              print(f"| {r['code']} | {r['tiles']} | {r['peaks']} | {own} | {src} | {r['seconds']} |")
          PY

      - name: Upload build as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packs-${{ github.run_id }}
          path: |
            out/v1/countries
            out/v1/peaks
            out/reports
          retention-days: 7
          if-no-files-found: ignore

      # Sparse checkout: only manifests, peak DBs, catalog and tile indexes (the tiles are gigabytes).
      - name: Publish to mowolf/height-data
        if: github.event_name == 'schedule' || github.event.inputs.publish == 'true'
        env:
          TOKEN: ${{ secrets.HEIGHT_DATA_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "::warning::HEIGHT_DATA_TOKEN not set: packs were built but not published (see docs/ci-setup.md)"
            exit 0
          fi
          git clone --depth 1 --filter=blob:none --no-checkout "https://x-access-token:${TOKEN}@github.com/${DATA_REPO}" data
          cd data
          git sparse-checkout set --no-cone '/README.md' '/v1/catalog.json' '/v1/countries/' '/v1/peaks/' '/v1/tiles/*/index.json'
          git checkout main
          cd ..
          pipeline/.venv/bin/peaker-pipeline publish --out "$OUT" --repo data
          cd data
          # --sparse: new tile files lie outside the sparse checkout (which holds only the tile indexes).
          git add --sparse -A v1
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git -c user.name="peaker-bot" -c user.email="peaker-bot@users.noreply.github.com" \
            commit -qm "Weekly peak update ($(date -u +%Y-%m-%d))"
          git push origin main
          echo "Published $(ls ../out/v1/countries | wc -l) packs to ${DATA_REPO}" >> "$GITHUB_STEP_SUMMARY"

      - name: Save download cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .peaker-cache
          key: peaker-cache-v2-${{ github.run_id }}-${{ github.run_attempt }}
