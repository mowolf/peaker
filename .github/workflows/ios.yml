name: ios

# Builds and tests the iOS app on every change; uploads to TestFlight from the default branch
# (or when started by hand). Setup: docs/ci-setup.md.

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      testflight:
        description: "Upload to TestFlight"
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test & build
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "${xcode:-/Applications/Xcode.app}"
          xcodebuild -version
          swift --version

      - name: PeakerKit tests
        run: swift test --package-path ios/PeakerKit

      - name: Generate Xcode project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v xcbeautify >/dev/null || brew install xcbeautify
          cd ios && xcodegen generate

      - name: Build app (simulator)
        timeout-minutes: 20
        run: ios/scripts/ci-build.sh

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ github.run_number }}
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 5

  testflight:
    name: TestFlight
    needs: build
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.testflight) ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.moritzwolf.peaker' }}
      DATA_URL: ${{ vars.PEAKER_DATA_URL }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY TEAM_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::TestFlight upload skipped, missing secrets:$missing (see docs/ci-setup.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - name: Select Xcode 26 and generate project
        if: steps.secrets.outputs.ready == 'true'
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "${xcode:-/Applications/Xcode.app}"
          xcodebuild -version
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v xcbeautify >/dev/null || brew install xcbeautify
          cd ios && xcodegen generate

      - name: Install App Store Connect API key
        if: steps.secrets.outputs.ready == 'true'
        run: |
          key="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          if printf '%s' "$ASC_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_PRIVATE_KEY" > "$key"
          else
            printf '%s' "$ASC_PRIVATE_KEY" | base64 --decode > "$key"   # also accept a base64-encoded .p8
          fi
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      # The archive is built unsigned; the export signs it with Apple's cloud-managed distribution
      # certificate via the API key (Xcode automatic signing), so no certificates live in the repo.
      - name: Archive
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -o pipefail
          xcodebuild archive -project ios/Peaker.xcodeproj -scheme Peaker -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Peaker.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" PEAKER_DATA_URL="$DATA_URL" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | xcbeautify --renderer github-actions

      - name: Sign and upload to TestFlight
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Peaker.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | xcbeautify --renderer github-actions
          echo "Uploaded build $BUILD_NUMBER of $BUNDLE_ID to App Store Connect. It shows up in TestFlight after processing (5–30 min)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
