name: pipeline

on:
  push:
    paths: ["pipeline/**", ".github/workflows/pipeline.yml"]
  pull_request:
    paths: ["pipeline/**", ".github/workflows/pipeline.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv venv .venv && uv pip install --python .venv/bin/python -e '.[dev]'
      - run: .venv/bin/python -m pytest -q -m "not network"
